<!doctype html>
<html lang="en">
  <head>
    <script id="fetch-getter-fix">
      (function() {
        try {
          let currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Fetch override patch warning:", e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Silence benign third-party ad script errors (like Adsterra) from bubbling up to the global error handler -->
    <script id="error-filter">
      window.addEventListener('error', function(e) {
        if (e.message === 'Script error.' || (e.filename && (e.filename.includes('highperformanceformat') || e.filename.includes('effectivecpmnetwork') || e.filename.includes('adsterra')))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message === 'Script error.') {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
