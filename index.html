<!doctype html>
<html lang="en">
  <head>
    <script id="fetch-getter-fix">
      (function() {
        try {
          let currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Fetch override patch warning:", e);
        }
      })();
    </script>
